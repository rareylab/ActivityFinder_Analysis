[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ActivityFinder_analysis_comparison"
version = "0.1.0"
description = "Here we create some analysis on the ActivityFinder data and the comparison to biochemgraph"
authors = [
    { name="Torben Gutermuth", email="torben.gutermuth@uni-hamburg.de" }
]
license = { text="MIT" }

dependencies = [
    "biopython>=1.85",
    "kaleido>=1.0.0",
    "levenshtein>=0.27.1",
    "matplotlib>=3.10.1",
    "matplotlib-venn>=1.1.2",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "pathlib>=1.0.1",
    "pillow>=11.1.0",
    "plotly==6.2.0",
    "plotnine>=0.14.5",
    "progressbar2>=4.5.0",
    "psycopg2>=2.9.10",
    "psycopg2-binary>=2.9.10",
    "rdkit>=2024.9.6",
    "requests>=2.32.3",
    "ruff>=0.11.0",
    "sqlalchemy>=2.0.39",
    "sshtunnel>=0.4.0",
    "supervenn>=0.5.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.5",
    "black>=21.9b0",
    "flake8>=3.9.2"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["./*.py"]
exclude = ["output_files*", "plots*", "input_files*"]
