[project]
name = "activity_db_analysis"
version = "0.3.0"
description = "Companion Python package for the C++ tool ActivityFinder developed in the Rarey lab at the ZBH in Hamburg, Germany."
authors = [{ name = "Emanuel Ehmki", email = "emanuel.ehmki@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["activityfinder", "chembl", "pdb", "bioinformatics", "cheminformatics", "drug-discovery"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: bioinformatics",
  "Topic :: Scientific/Engineering :: cheminformatics",
]
dependencies = [
  "loguru>=0.6,<1.0",
  "typer>=0.7.0,<1.0",
  "numpy==1.26.4",
  "pandas>=1.4.0,<3.0",
  "matplotlib>=3.6.1,<4.0",
  "psycopg2-binary>=2.9.5,<3.0",
  "pydantic>=1.10.2,<2.0",
  "rtoml>=0.9.0,<1.0",
  "platformdirs>=4.3.8",
]

[project.scripts]
actfind = "activity_db_analysis.cli:app"

[project.urls]
Homepage = "https://github.com/rarey-group/ActivityDB_analysis"
Repository = "https://github.com/rarey-group/ActivityDB_analysis"
"Bug Tracker" = "https://github.com/rarey-group/ActivityDB_analysis/issues"

[project.optional-dependencies]
plotting = [
  "seaborn>=0.11.2,<1.0",
]
dev = [
  "pytest>=7.0,<8.0",
  "pytest-cov>=3.0.0,<6.0",
  "ruff>=0.4.0,<1.0",
  "docformatter>=1.5.0,<2.0",
]
docs = [
  "sphinx>=5.3.0,<8.0",
  "sphinx-rtd-theme>=1.1.1,<3.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["activity_db_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
# Target Python 3.11
target-version = "py311"
# Include all Python files
include = ["*.py", "*.pyi"]
# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Select comprehensive rule sets:
# E, W = pycodestyle errors and warnings
# F = pyflakes
# I = isort (import sorting)
# UP = pyupgrade (Python upgrade suggestions)
# B = flake8-bugbear (common bugs)
# SIM = flake8-simplify
# C4 = flake8-comprehensions
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults (needed for typer)
]

[tool.ruff.lint.isort]
# isort configuration
known-first-party = ["activity_db_analysis"]

[tool.ruff.format]
# Use double quotes like black
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Unix line endings
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
